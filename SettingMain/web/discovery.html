<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SettingManager · 주차면 탐색</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar"><h1>SettingManager</h1><nav><a href="/">카메라 제어</a><a href="/discovery" class="active">주차면 탐색</a><a href="/options">옵션</a></nav></header>
  <main>
    <div class="layout discovery-layout">
      <section id="discoveryTarget" class="card">
        <h2>대상 카메라 <span class="tag" id="capability">확인 중</span></h2>
        <div class="body"><div class="row"><div class="field"><label for="cameraSelect">카메라</label><select id="cameraSelect"></select></div><button id="activateCamera">활성으로 선택</button></div><div class="row"></div><p class="capability-note" id="cameraNote" aria-live="polite">코어 구현은 <a href="/options">/options</a> 에서 정합니다. 이 화면은 현재 코어가 할 수 있는 것만 켭니다.</p></div>
      </section>
      <aside id="discoveryViewer" class="discovery-view" aria-label="선택 카메라 영상">
        <section class="card discovery-stream-card">
          <h2>카메라 뷰 <span class="tag" id="streamTag" aria-live="polite">정지</span></h2>
          <div class="viewport" id="discoveryStreamViewport" aria-label="주차면 탐색 영상 클릭 센터링 영역"><img id="stream" alt="선택한 카메라의 영상"><span class="stream-center-cross" aria-hidden="true"></span><span id="discoveryStreamClickMarker" class="stream-click-marker" aria-hidden="true" hidden></span><div class="placeholder" id="streamPlaceholder">영상은 자동으로 시작하지 않습니다. 「시작」 또는 「스냅샷 1장」을 누르세요.</div></div>
          <div class="body discovery-stream-actions"><div class="row"><button id="streamStart" class="primary" type="button" aria-controls="stream" disabled>시작</button><button id="streamStop" type="button" aria-controls="stream" disabled>정지</button><button id="snapshotOnce" type="button" aria-controls="stream" disabled>스냅샷 1장</button></div></div>
        </section>
      </aside>
      <div id="advanced">
        <section class="card"><h2>탐색 프리셋</h2><div class="body"><div class="row"><div class="field"><label for="presetSelect">프리셋</label><select id="presetSelect"></select></div><button id="presetGoto" class="primary">이동</button></div><div class="row"><div class="field"><label for="presetName">이름</label><input id="presetName" maxlength="60"></div><button id="presetCreate">추가</button><button id="presetUpdate">수정</button><button id="presetDelete" class="danger">삭제</button></div></div></section>
        <section class="card"><h2>주차면 점</h2><div class="body"><div class="row"><div class="field"><label for="pointSelect">점</label><select id="pointSelect"></select></div></div><div class="row"><div class="field"><label for="pointX">x</label><input id="pointX" type="number"></div><div class="field"><label for="pointY">y</label><input id="pointY" type="number"></div></div><div class="row"><button id="pointCreate">추가</button><button id="pointUpdate">수정</button><button id="pointDelete" class="danger">삭제</button><button id="center">개별 센터</button><button id="centerBox" disabled title="BackendCore discovery point는 box 좌표를 저장하지 않습니다">개별 센터+줌 (미지원)</button></div><p class="hint">BackendCore discovery point는 x/y만 저장합니다. 별도 box 정본이 도입되기 전까지 개별 센터+줌은 지원하지 않습니다.</p></div></section>
        <section class="card"><h2>자동 작업</h2><div class="body"><div class="row"><div class="field"><label for="calibrationMode">캘리브레이션</label><select id="calibrationMode"><option value="full">full</option><option value="verify">verify</option></select></div><button id="calibrationStart">시작</button><button id="calibrationStop">정지</button><span id="calibrationStatus" class="badge idle">-</span></div><div class="row"><button id="homeStart">번호판 호밍 시작</button><button id="homeStop">정지</button><span id="homeStatus" class="badge idle">-</span></div><p class="hint">자동 작업은 실제 카메라를 움직일 수 있습니다.</p></div></section>
      </div>
    </div>
  </main>
  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/discovery.js"></script>
</body>
</html>
